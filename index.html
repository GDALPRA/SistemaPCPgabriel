<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERP ORFAs — Produção & Separação</title>
<script>
  const _warn = console.warn;
  console.warn = (...args) => {
    if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
    _warn.apply(console, args);
  };
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14232a;--side:#12262e;--paper:#f3f4f2;--acc:#0e7490;--line:#d9dedb}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-left:3px solid transparent;color:#b8c7cc;font-size:14px;cursor:pointer}
.nav a:hover{background:#1a3540;color:#fff}
.nav a.on{background:#1a3540;color:#fff;border-left-color:#f59e0b;font-weight:600}
.nav .grp{padding:14px 14px 4px;font-size:12px;color:#6f8a92}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--ink);color:#fff;text-align:left;padding:8px 10px;font-weight:600;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#eef3f2}
.box{background:#fff;border:1px solid var(--line);border-radius:6px}
.btn{padding:7px 14px;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:#b91c1c}
input,select{border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:13px;background:#fff}
input:focus,select:focus,.btn:focus-visible,.nav a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;background:#e2e8e6}
.scroll{overflow-x:auto}
@media print{aside,header,.noprint{display:none!important}main{padding:0!important}body{background:#fff}@page{size:A4 landscape;margin:10mm}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="box p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold">ERP ORFAs</h1>
    <p class="text-sm text-slate-500 mb-5">Entre com seu usuário para acessar o painel de produção.</p>
    <label class="text-sm font-medium">Usuário</label>
    <input id="lu" class="w-full mb-3" autocomplete="username">
    <label class="text-sm font-medium">Senha</label>
    <input id="lp" type="password" class="w-full mb-3" autocomplete="current-password">
    <div id="lerr" class="text-sm text-red-700 mb-2"></div>
    <button class="btn w-full" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden min-h-screen md:flex">
  <aside class="w-full md:w-64 md:min-h-screen shrink-0" style="background:var(--side)">
    <div class="px-4 py-4 text-white font-bold text-lg border-b border-white/10">ERP ORFAs</div>
    <nav id="nav" class="nav pb-4"></nav>
  </aside>
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="bg-white border-b border-[var(--line)] px-5 py-3 flex flex-wrap items-center justify-between gap-3">
      <h2 id="title" class="font-bold text-lg"></h2>
      <div class="flex items-center gap-2 text-sm">
        <span id="who" class="text-slate-600"></span>
        <button class="btn sec" onclick="logout()">Sair</button>
      </div>
    </header>
    <main class="p-5 space-y-4 flex-1">
      <div id="toast" class="hidden noprint px-3 py-2 rounded text-sm bg-amber-100 border border-amber-300"></div>
      <div id="filters" class="box p-3 flex flex-wrap gap-3 noprint"></div>
      <div id="view"></div>
    </main>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ================= PERFIS DE ACESSO ================= */
const MODULOS_ENG=['bandejas_pead','chapas_cristal','chapas_inox','portas_frames','tubos_chassis','materiais_padrao'];
const ALL=['dashboard','pedidos','familias','bojos','refrig','separacao','op_injecao',...MODULOS_ENG,'historico','usuarios'];
const ROLES={
  admin:{label:'Administrador',pages:ALL,can:['import','export','delete','users']},
  pcp:{label:'PCP / Programação',pages:ALL.filter(p=>p!=='usuarios'),can:['import','export']},
  separacao:{label:'Separação de peças',pages:['separacao','materiais_padrao'],can:['export']},
  bojos:{label:'Setor de Bojos',pages:['bojos','bandejas_pead'],can:['export']},
  leitura:{label:'Somente leitura',pages:['dashboard','pedidos','familias','op_injecao',...MODULOS_ENG],can:[]}
};
const PAGES={
  dashboard:'Dashboard',
  pedidos:'Pedidos / ORFAs',
  familias:'Famílias',
  bojos:'Bojos',
  refrig:'Refrigeração',
  separacao:'Separação',
  op_injecao:'OP INJEÇÃO',
  bandejas_pead:'Bandejas & PEAD',
  chapas_cristal:'Chapas Cristal (VA)',
  chapas_inox:'Chapas Inox',
  portas_frames:'Portas & Frames',
  tubos_chassis:'Tubos / Chassis',
  materiais_padrao:'Materiais Padrão',
  historico:'Histórico de PDFs',
  usuarios:'Usuários e acessos'
};
const FAMS={'VERTICAL ALTO':'#2563eb','AÇOUGUE':'#dc2626','PADARIA':'#d97706','ESPECIAIS':'#7c3aed','A DEFINIR':'#64748b'};
const PAL=['#0e7490','#d97706','#7c3aed','#dc2626','#059669','#2563eb','#db2777','#65a30d'];

/* ================= ESTADO ================= */
let user=null,imports=[],items=[],page='dashboard',famSel=null,visao='detalhada',tipoPecaFiltro='ALL',charts={};
const F={cliente:'ALL',orfa:'ALL',busca:''};
const MP={
  solicitante:'Gabriel Dalpra',
  setor:'PCP',
  categoria:'Todas',
  busca:'',
  selecoes:{} // chave: cod -> {modo, val}
};
const can=a=>user&&ROLES[user.role].can.includes(a);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
const sum=a=>a.reduce((s,i)=>s+i.qtd,0);
const fmtPt=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});

/* ================= BANCO LOCAL (IndexedDB) ================= */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('erp_orfas',1);r.onupgradeneeded=()=>r.result.createObjectStore('imports',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const dbAll=async()=>{const d=await idb();return new Promise(ok=>{const q=d.transaction('imports').objectStore('imports').getAll();q.onsuccess=()=>ok(q.result)})};
const dbPut=async o=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('imports','readwrite');t.objectStore('imports').put(o);t.oncomplete=ok})};
const dbDel=async id=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('imports','readwrite');t.objectStore('imports').delete(id);t.oncomplete=ok})};
async function reload(){imports=(await dbAll()).sort((a,b)=>b.date-a.date);items=imports.flatMap(i=>i.items.map(x=>({...x,importId:i.id})))}

/* ================= USUÁRIOS ================= */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const getUsers=()=>JSON.parse(localStorage.getItem('erp_users')||'[]');
const setUsers=u=>localStorage.setItem('erp_users',JSON.stringify(u));
async function seedUsers(){if(!getUsers().length)setUsers([{name:'admin',pass:await sha('admin123'),role:'admin'}])}
async function doLogin(){
  const nomeInput=$('lu').value.trim().toLowerCase();
  const u=getUsers().find(x=>x.name.trim().toLowerCase()===nomeInput);
  if(u&&u.pass===await sha($('lp').value)){sessionStorage.setItem('erp_user',JSON.stringify({name:u.name,role:u.role}));start()}
  else $('lerr').textContent='Usuário ou senha incorretos. (Em um novo endereço como o GitHub, usuários criados no localhost não vêm automáticos; entre com admin / admin123 para criar os acessos aqui.)';
}
function logout(){sessionStorage.removeItem('erp_user');location.reload()}
$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

async function start(){
  user=JSON.parse(sessionStorage.getItem('erp_user')||'null');
  if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}
  $('login').classList.add('hidden');$('app').classList.remove('hidden');$('app').classList.add('md:flex');
  $('who').textContent=`${user.name} · ${ROLES[user.role].label}`;
  await reload();page=ROLES[user.role].pages[0];go(page);
}

/* ================= NAVEGAÇÃO ================= */
function famsPresent(){return [...new Set(items.map(i=>i.familia))].sort()}
function renderNav(){
  const allowed=ROLES[user.role].pages;let h='<div class="grp">Módulos</div>';
  let engAdded=false;
  for(const p of allowed){
    if(p==='familias'){
      h+=`<div class="grp">Famílias de expositores</div>`;
      const fl=famsPresent();
      h+=fl.length?fl.map(f=>`<a class="${page==='familias'&&famSel===f?'on':''}" onclick="go('familias','${esc(f)}')"><span>${esc(f)}</span><span>${sum(items.filter(i=>i.familia===f))}</span></a>`).join(''):'<div class="px-4 py-1 text-xs text-slate-400">Importe PDFs para ver as famílias</div>';
      h+='<div class="grp">Outros módulos</div>';continue;
    }
    if(MODULOS_ENG.includes(p)&&!engAdded){
      h+='<div class="grp">Engenharia & Cálculo (PDF)</div>';
      engAdded=true;
    }
    if(p==='historico'){
      h+='<div class="grp">Sistema</div>';
    }
    h+=`<a class="${page===p?'on':''}" onclick="go('${p}')"><span>${PAGES[p]}</span></a>`;
  }
  $('nav').innerHTML=h;
}
function go(p,fam){page=p;if(p==='familias')famSel=fam||famSel||famsPresent()[0]||null;render()}

/* ================= FILTROS ================= */
const filtered=()=>items.filter(i=>(F.cliente==='ALL'||i.cliente===F.cliente)&&(F.orfa==='ALL'||i.orfa===F.orfa)&&(!F.busca||Object.values(i).join(' ').toLowerCase().includes(F.busca)));
function renderFilters(){
  const opt=(k,all)=>`<option value="ALL">${all}</option>`+[...new Set(items.map(i=>i[k]))].sort().map(v=>`<option ${F[k]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('');
  const show=['dashboard','pedidos','familias','bojos','refrig','separacao','op_injecao','bandejas_pead','chapas_cristal','chapas_inox','portas_frames','tubos_chassis'].includes(page);
  $('filters').style.display=show?'flex':'none';
  $('filters').innerHTML=`<select onchange="F.cliente=this.value;render()">${opt('cliente','Todos os clientes')}</select>
  <select onchange="F.orfa=this.value;render()">${opt('orfa','Todas as ORFAs')}</select>
  <input class="flex-1 min-w-[180px]" placeholder="Buscar modelo, acabamento, gás, obs..." value="${esc(F.busca)}" oninput="F.busca=this.value.toLowerCase();clearTimeout(window._t);window._t=setTimeout(render,250)">
  <button class="btn sec" onclick="window.print()">Imprimir / PDF</button>
  ${can('export')?'<button class="btn" onclick="exportExcel()">Exportar Excel</button>':''}`;
}

/* ================= HELPERS DE CONVERSÃO DOS ITENS DA ORFA ================= */
function compEmMetros(item){
  const raw=String(item.comprimento||'').replace(',','.').trim();
  const n=parseFloat(raw);
  if(!n||isNaN(n))return 0;
  return n>10 ? n/1000 : n;
}
function textoAlinhamentoItem(item){
  const partes=[item.modelo, item.comprimento ? `${item.comprimento}mm` : '', item.porta, item.acbExt, item.acbTt, item.obsGeral].filter(x=>x&&x!=='-');
  return partes.join(' ').toUpperCase();
}

/* ================= REGRAS OP INJEÇÃO ================= */
function calcInjecao(L){
  const rows=[];
  const pushRow=(tipo,peca,material,dimensao,compNum,qtd,orfa,cliente,modelo,familia,modo,grupoLinha)=>rows.push({tipo,peca,material,dimensao,compNum,qtd,orfa,cliente,modelo,familia,modo,grupoLinha});
  for(const i of L){
    const m=(i.modelo||'').toUpperCase().trim();
    const comp=String(i.comprimento||'').trim();
    const compNum=parseFloat(comp.replace(',','.'))||0;
    const dim=comp?`${comp} mm`:'-';
    const matBojo=i.bojo||'NÃO INFORMADO';
    const corTetoVil=(i.acbExt&&i.acbExt!=='-')?i.acbExt:matBojo;
    const portMatch=m.match(/\b([23])P\b/);
    const sufixoPortas=portMatch?`${portMatch[1]}P`:'';
    const isVilCanto180=/\b(PONTA\s*CT\s*180|CT\s*180|CANTO\s*180|180)\b/.test(m)&&/^VIL/.test(m);
    const isVilCanto90=/\b(CT\s*90|CANTO\s*90|90)\b/.test(m)&&/^VIL/.test(m);
    const isVilCentral=/\bCENTRAL\b/.test(m)&&/^VIL/.test(m);

    if(/^VA/.test(m)){
      pushRow('BOJO','BOJO VA',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VERTICAL ALTO');
      pushRow('COSTAS','COSTAS VA','CN ZN 0,43',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VERTICAL ALTO');
      pushRow('TETO','TETO VA','CN ZN 0,43',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VERTICAL ALTO');
    } else if(isVilCanto180){
      pushRow('BOJO','BOJO VIL CT 180',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
      pushRow('TETO','TETO CANTO 180',corTetoVil,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
    } else if(isVilCanto90){
      pushRow('BOJO','BOJO VIL CT 90',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
    } else if(isVilCentral){
      pushRow('COSTAS',`COSTA${sufixoPortas}`,'INOX',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
      pushRow('TETO','TETO VIL CENTRAL',corTetoVil,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
    } else if(/^VIL/.test(m)){
      const costasPeca=portMatch?`COSTAS VIL${portMatch[1]}P`:'COSTAS VIL';
      pushRow('BOJO','BOJO VIL X VR',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
      pushRow('COSTAS',costasPeca,'INOX',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
      pushRow('TETO','TETO VIL',corTetoVil,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VIL');
    } else if(/^VRA/.test(m)){
      pushRow('BOJO','BOJO VRA','INOX',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VRA');
      pushRow('COSTAS','COSTAS VRA','INOX',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VRA');
      pushRow('TAMPO','TAMPO VRA',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VRA');
    } else if(/^VCA/.test(m)){
      pushRow('BOJO','BOJO VCA',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VCA');
      pushRow('TAMPO','TAMPO VCA',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VCA');
    } else if(/^VR(?!A)/.test(m)){
      pushRow('BOJO','BOJO VIL X VR',matBojo,dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VR');
      pushRow('COSTAS','COSTAS VRP','INOX',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'COMPONENTE','VR');
    } else {
      pushRow('INTEIRO',m||'-','-',dim,compNum,i.qtd,i.orfa,i.cliente,i.modelo,i.familia,'INTEIRO','ESPECIAIS / INTEIROS');
    }
  }
  return rows;
}
const TIPO_ORD={'BOJO':1,'COSTAS':2,'TETO':3,'TAMPO':4,'INTEIRO':5};
const GRUPO_ORD={'VERTICAL ALTO':1,'VIL':2,'VRA':3,'VCA':4,'VR':5,'ESPECIAIS / INTEIROS':6};
function groupInjecao(L,sequencial=false,porFamiliaPeca=false,tipoPeca='ALL'){
  let raw=calcInjecao(L);
  if(tipoPeca&&tipoPeca!=='ALL')raw=raw.filter(r=>r.tipo===tipoPeca);
  const m=new Map();
  for(const r of raw){
    const k=[r.tipo,r.peca,r.material,r.dimensao,r.modo,r.grupoLinha].join('|');
    if(!m.has(k))m.set(k,{tipo:r.tipo,peca:r.peca,material:r.material,dimensao:r.dimensao,compNum:r.compNum,modo:r.modo,grupoLinha:r.grupoLinha,qtd:0,orfas:new Set(),modelos:new Set(),fams:new Set()});
    const g=m.get(k);g.qtd+=r.qtd;g.orfas.add(r.orfa);g.modelos.add(r.modelo);g.fams.add(r.familia);
  }
  const arr=[...m.values()];
  if(porFamiliaPeca){
    return arr.sort((a,b)=>(TIPO_ORD[a.tipo]??99)-(TIPO_ORD[b.tipo]??99)||(GRUPO_ORD[a.grupoLinha]??99)-(GRUPO_ORD[b.grupoLinha]??99)||b.compNum-a.compNum||a.peca.localeCompare(b.peca));
  }
  if(sequencial){
    return arr.sort((a,b)=>(GRUPO_ORD[a.grupoLinha]??99)-(GRUPO_ORD[b.grupoLinha]??99)||(TIPO_ORD[a.tipo]??99)-(TIPO_ORD[b.tipo]??99)||b.compNum-a.compNum||a.peca.localeCompare(b.peca));
  }
  return arr.sort((a,b)=>b.qtd-a.qtd);
}

/* ================= 1. BANDEJAS ABS & PEAD ================= */
const FATORES_BANDEJAS={
  VCA2P:{C790:4,C530:8,C410:0},
  VRA2P:{C790:4,C530:0,C410:8},
  VRA1P:{C790:4,C530:0,C410:4},
  VRAG:{C790:4,C530:0,C410:0},
  VCAG:{C790:4,C530:0,C410:0}
};
const MODELOS_BANDEJAS=Object.keys(FATORES_BANDEJAS);

function extrairModulosPorModelo(textoAlinhamento,dimensaoTotal){
  const texto=String(textoAlinhamento||'').toUpperCase().replace(',','.');
  const modulosPorModelo={};
  const encontrados=[...texto.matchAll(/([A-Z0-9]+)\s*\(([\d.]+)\)/g)];
  if(encontrados.length){
    for(const [,modelo,tamanhoStr] of encontrados){
      if(MODELOS_BANDEJAS.includes(modelo)){
        const metragem=parseFloat(tamanhoStr);
        if(!isNaN(metragem)){
          modulosPorModelo[modelo]=(modulosPorModelo[modelo]||0)+(metragem/1.25);
        }
      }
    }
  }
  if(!Object.keys(modulosPorModelo).length){
    for(const modelo of MODELOS_BANDEJAS){
      if(texto.includes(modelo)){
        modulosPorModelo[modelo]=dimensaoTotal>0?(dimensaoTotal/1.25):0;
        break;
      }
    }
  }
  return modulosPorModelo;
}

function calcBandejasPead(L){
  const detalhada=[];
  for(const it of L){
    const dim=compEmMetros(it);
    const qtdItem=Number(it.qtd)||1;
    const alinh=textoAlinhamentoItem(it);
    const modDict=extrairModulosPorModelo(alinh,dim);
    for(const [modelo,modUnit] of Object.entries(modDict)){
      const modQtd=modUnit*qtdItem;
      const fat=FATORES_BANDEJAS[modelo]||{C790:0,C530:0,C410:0};
      const c790=Math.round(modQtd*fat.C790);
      const c530=Math.round(modQtd*fat.C530);
      const c410=Math.round(modQtd*fat.C410);
      const totalAbs=c790+c530+c410;
      detalhada.push({
        cliente:it.cliente,
        orfa:it.orfa,
        modelo,
        modulos:modQtd,
        c790,c530,c410,
        totalAbs
      });
    }
  }

  const mapCli=new Map();
  const mapMod=new Map();
  for(const r of detalhada){
    const kc=`${r.cliente}|${r.orfa}|${r.modelo}`;
    if(!mapCli.has(kc))mapCli.set(kc,{cliente:r.cliente,orfa:r.orfa,modelo:r.modelo,modulos:0,c790:0,c530:0,c410:0,totalAbs:0});
    const gc=mapCli.get(kc);
    gc.modulos+=r.modulos;gc.c790+=r.c790;gc.c530+=r.c530;gc.c410+=r.c410;gc.totalAbs+=r.totalAbs;

    if(!mapMod.has(r.modelo))mapMod.set(r.modelo,{modelo:r.modelo,modulos:0,c790:0,c530:0,c410:0,totalAbs:0});
    const gm=mapMod.get(r.modelo);
    gm.modulos+=r.modulos;gm.c790+=r.c790;gm.c530+=r.c530;gm.c410+=r.c410;gm.totalAbs+=r.totalAbs;
  }

  const porCliente=[...mapCli.values()];
  const geralModelo=[...mapMod.values()];
  const totC790=geralModelo.reduce((s,x)=>s+x.c790,0);
  const totC530=geralModelo.reduce((s,x)=>s+x.c530,0);
  const totC410=geralModelo.reduce((s,x)=>s+x.c410,0);

  const placasC790=Math.ceil(totC790/1.0);
  const placasC530=Math.ceil(totC530/1.0);
  const placasC410=Math.ceil(totC410/2.0);

  const pead=[
    {medida:'1000 × 510 mm',espessura:'5,5 mm',tipoBandeja:'L290 × C790 (REF. MAIOR)',qtdPlacas:placasC790,pesoUnit:2.50,pesoTotal:Number((placasC790*2.50).toFixed(2))},
    {medida:'750 × 500 mm',espessura:'5,5 mm',tipoBandeja:'L290 × C530 (REF. MÉDIA)',qtdPlacas:placasC530,pesoUnit:1.84,pesoTotal:Number((placasC530*1.84).toFixed(2))},
    {medida:'780 × 600 mm',espessura:'5,5 mm',tipoBandeja:'L290 × C410 (REF. MENOR - 2 un/placa)',qtdPlacas:placasC410,pesoUnit:2.29,pesoTotal:Number((placasC410*2.29).toFixed(2))}
  ];

  return {
    detalhada,
    porCliente,
    geralModelo,
    pead,
    totalClientes:new Set(porCliente.map(x=>x.cliente)).size,
    totalModulos:detalhada.reduce((s,x)=>s+x.modulos,0),
    totalBandejasAbs:detalhada.reduce((s,x)=>s+x.totalAbs,0),
    totalPesoPead:pead.reduce((s,x)=>s+x.pesoTotal,0)
  };
}

function calcChapasCristal(L){
  const detalhamento=[];

function extrairModulosAcougue(textoAlinhamento){
  const texto=String(textoAlinhamento||'').toUpperCase();
  const res={p1:0,p2:0};
  const matches=[...texto.matchAll(/(1P|2P|G)?\s*\(?([0-9]+[,.][0-9]+)\)?/g)];
  for(const [,tipo,medStr] of matches){
    const med=parseFloat(medStr.replace(',','.'));
    if(!isNaN(med)){
      const mod125=med/1.25;
      const t=(tipo||'').trim();
      if(t.includes('2P'))res.p2+=mod125;
      else if(t.includes('1P'))res.p1+=mod125;
    }
  }
  return res;
}

function calcChapasInox(L){
  const detalhamento=[];
  let tot={c157219:0,c053583:0,c104818:0,c157228:0,c156102:0,c153549:0,c156082:0,c151947:0,c157101:0};

  for(const it of L){
    const linha=String(it.familia||'VERTICAL ALTO').toUpperCase();
    const alinh=textoAlinhamentoItem(it);
    const dimFloat=compEmMetros(it);
    const qtd=Number(it.qtd)||1;
    const isVap=/\bVAP/.test(alinh)||/\bVAP/.test(String(it.modelo||'').toUpperCase());
    const isVra=linha.includes('VRA')||/\bVRA/.test(alinh);
    const isVca=(linha.includes('VCA')||linha.includes('AÇOUGUE')||/\bVCA/.test(alinh))&&!isVra;
    const isAcougue=isVca||isVra;

    let c157219=0,c053583=0,c104818=0,c157228=0,c156102=0,c153549=0,c156082=0,c151947=0,c157101=0;

    if(isVra){
      const modEquiv=dimFloat>0?(dimFloat/1.25):1.0;
      const bandejasTot=(dimFloat===1.87||dimFloat===1.875)?(2*qtd):(modEquiv*3*qtd);
      c157219+=bandejasTot/8.0;

      const infoPrat=extrairModulosAcougue(alinh);
      if(infoPrat.p1>0||infoPrat.p2>0){
        c157219+=(((infoPrat.p1*1)+(infoPrat.p2*2))*qtd)/6.0;
      } else if(alinh.includes(' 1P')||alinh.includes(' 2P')){
        const nNiveis=alinh.includes(' 2P')?2:1;
        const modTot=Number((dimFloat/1.25).toFixed(2));
        c157219+=((modTot*nNiveis)*qtd)/6.0;
      }
    } else if(isVca){
      const modEquiv=dimFloat>0?(dimFloat/1.25):1.0;
      const bandejasTot=(dimFloat===1.87||dimFloat===1.875)?(2*qtd):(modEquiv*3*qtd);
      c157219+=bandejasTot/8.0;

      if(dimFloat===2.0)c157219+=(1*qtd)/4.0;
      else if(dimFloat===2.5)c157219+=(2*qtd)/12.0;
      else if(dimFloat===3.75)c157219+=(3*qtd)/12.0;
      else if(dimFloat===1.87||dimFloat===1.875)c157219+=(1*qtd)/8.0;
      else c157219+=(1*qtd)/12.0;
    } else if(!isAcougue){
      if(dimFloat===1.87){
        c157219+=(10*qtd)/12.0;
        c157219+=(10*qtd)/22.0;
        c157219+=(1*qtd)/6.0;
      } else if(isVap){
        const mod075=Math.round(dimFloat/0.75);
        c157219+=((mod075*10)*qtd)/18.0;
        c157219+=((mod075*1)*qtd)/9.0;
      } else {
        let mod125=Number((dimFloat/1.25).toFixed(2));
        if(dimFloat===2.25)mod125=2.0;
        else if(dimFloat===3.0)mod125=2.5;
        c157219+=((mod125*10)*qtd)/12.0;
        c157219+=((mod125*1)*qtd)/6.0;
      }
    }

    if([1.25,1.5,2.0,2.25,2.5].includes(dimFloat)){
      c153549=dimFloat===1.25?Math.ceil(qtd/2.0):Number(qtd);
    } else if([1.87,1.875,3.0,3.75].includes(dimFloat)){
      c156082=(dimFloat===1.87||dimFloat===1.875)?Math.ceil(qtd/2.0):Number(qtd);
    }

    if(isVra){
      if(dimFloat===2.0||dimFloat===2.5)c053583+=qtd*2.0;
      else if(dimFloat===1.25)c053583+=Number(qtd);
      else if(dimFloat===3.75)c157228+=qtd*2.0;
      else if(dimFloat===1.87||dimFloat===1.875)c157228+=Number(qtd);

      if(dimFloat===1.25)c156102+=(2*qtd)/4.0;
      else if([1.87,1.875,2.0,2.5].includes(dimFloat))c156102+=(4*qtd)/4.0;
      else if(dimFloat===3.75)c156102+=(6*qtd)/4.0;
    }

    if(isVca){
      if(dimFloat===1.25)c156102+=(2*qtd)/5.0;
      else if([1.87,1.875,2.0,2.5].includes(dimFloat))c156102+=(4*qtd)/5.0;
      else if(dimFloat===3.75)c156102+=(6*qtd)/5.0;
    }

    if(isAcougue){
      if(dimFloat===2.5)c151947+=qtd/2.0;
      else if(dimFloat===1.25)c151947+=qtd/4.0;
      else if(dimFloat===3.75)c157101+=Number(qtd);
      else if([2.0,1.87,1.875].includes(dimFloat))c157101+=qtd/2.0;

      if(dimFloat===2.5)c053583+=qtd/2.0;
      else if(dimFloat===1.25)c053583+=qtd/4.0;
      else if(dimFloat===3.75)c104818+=Number(qtd);
      else if([2.0,1.87,1.875].includes(dimFloat))c104818+=qtd/2.0;
    } else {
      if(dimFloat===1.25){
        c053583+=((1*3)*qtd)/4.0+(qtd/4.0);
      } else if(dimFloat===1.5){
        c053583+=((2*3)*qtd)/6.0+(qtd/2.0);
      } else if(dimFloat===1.87||dimFloat===1.875){
        c053583+=(3*qtd)/4.0;
        c104818+=((3*qtd)/6.0)+((1*qtd)/2.0);
      } else if(dimFloat===2.25){
        c053583+=((3*3)*qtd)/6.0+(qtd/2.0);
      } else if(dimFloat===2.5){
        c053583+=((2*3)*qtd)/4.0+(qtd/2.0);
      } else if(dimFloat===3.0){
        c053583+=((4*3)*qtd)/6.0+((2*qtd)/2.0);
      } else if(dimFloat===3.75){
        c053583+=((3*3)*qtd)/4.0;
        c104818+=(2*qtd)/2.0;
      }
    }

    const itemVals={c157219,c053583,c104818,c157228,c156102,c153549,c156082,c151947,c157101};
    let pesoItem=0;
    for(const k of Object.keys(itemVals)){
      tot[k]+=itemVals[k];
      pesoItem+=itemVals[k]*PESO_INOX[k];
    }

    detalhamento.push({
      cliente:it.cliente,
      orfa:it.orfa,
      linha,
      dimensao:it.comprimento||dimFloat,
      alinhamento:it.modelo,
      c157219:Number(c157219.toFixed(2)),
      c053583:Number(c053583.toFixed(2)),
      c104818:Number(c104818.toFixed(2)),
      c157228:Number(c157228.toFixed(2)),
      c156102:Number(c156102.toFixed(2)),
      c153549:Number(c153549.toFixed(2)),
      c156082:Number(c156082.toFixed(2)),
      c151947:Number(c151947.toFixed(2)),
      c157101:Number(c157101.toFixed(2)),
      pesoTotal:Number(pesoItem.toFixed(2))
    });
  }

  const catalog=[
    {key:'c157219',cod:'157219',label:'0,8 (3900)',desc:'CH 0.80 x 1240 x 3900 INOX 304'},
    {key:'c053583',cod:'053583',label:'0,6 (2560)',desc:'CH 0.60 x 1240 x 2560 INOX 304'},
    {key:'c104818',cod:'104818',label:'0,6 (2000)',desc:'CH 0.60 x 1240 x 2000 INOX 304'},
    {key:'c157228',cod:'157228',label:'0,6 (3840 VRA)',desc:'CH 0.60 x 1240 x 3840 INOX 304'},
    {key:'c156102',cod:'156102',label:'1,2 (2960 Colunas)',desc:'CH 1.20 x 1240 x 2960 INOX 304'},
    {key:'c153549',cod:'153549',label:'0,4 (2540)',desc:'CH 0.40 x 1240 x 2540 INOX 304'},
    {key:'c156082',cod:'156082',label:'0,4 (3780)',desc:'CH 0.40 x 1240 x 3780 INOX 304'},
    {key:'c151947',cod:'151947',label:'0,4 (2550)',desc:'CH 0.40 x 1240 x 2550 INOX 430'},
    {key:'c157101',cod:'157101',label:'0,4 (2060)',desc:'CH 0.40 x 1240 x 2060 INOX 430'}
  ];

  const resumo=catalog.map(c=>({
    ...c,
    qtd:Number(tot[c.key].toFixed(2)),
    peso:Number((tot[c.key]*PESO_INOX[c.key]).toFixed(2))
  })).filter(r=>r.qtd>0);

  const totalChapas=Number(Object.values(tot).reduce((s,v)=>s+v,0).toFixed(2));
  const pesoTotal=Object.keys(tot).reduce((s,k)=>s+(tot[k]*PESO_INOX[k]),0);

  return {detalhamento,resumo,totalChapas,pesoTotal};
}

/* ================= 4. PORTAS, FRAMES & EXPOSITORES ABERTOS ================= */
const CODIGOS_PORTAS_VA={
  'PRETA|SERIGRAFADA|DIR':'153828',
  'PRETA|SERIGRAFADA|ESQ':'153829',
  'PRETA|TRANSPARENTE|DIR':'153830',
  'PRETA|TRANSPARENTE|ESQ':'153831',
  'CINZA|SERIGRAFADA|DIR':'153318',
  'CINZA|SERIGRAFADA|ESQ':'153319',
  'CINZA|TRANSPARENTE|DIR':'153832',
  'CINZA|TRANSPARENTE|ESQ':'153833'
};
const CODIGOS_PORTAS_VAP={CINZA:'154222',PRETA:'154221'};
const CODIGOS_FRAMES_VA={
  'CINZA|1250':'154183','CINZA|1875':'154678','CINZA|2500':'154157','CINZA|3750':'154158',
  'PRETA|1250':'154184','PRETA|1875':'162726','PRETA|2500':'153826','PRETA|3750':'153827'
};
const CODIGOS_QUADROS_VAP={
  'CINZA|1500':'154220','CINZA|2250':'154219','CINZA|3000':'154218','CINZA|3750':'154217',
  'PRETA|1500':'154216','PRETA|2250':'154215','PRETA|3000':'154214','PRETA|3750':'154213'
};
const CHAVES_PORTAS_MM=[1250,1500,1875,2250,2500,3000,3750];

function convDimPortasMm(valDim){
  const val=parseFloat(String(valDim??1.25).replace(',','.'));
  if(isNaN(val))return 1250;
  if(val>=1.85&&val<=1.89)return 1875;
  const mm=val<=10.0?Math.round(val*1000):Math.round(val);
  return CHAVES_PORTAS_MM.reduce((best,cur)=>Math.abs(cur-mm)<Math.abs(best-mm)?cur:best,CHAVES_PORTAS_MM[0]);
}

function calcPortasFrames(L){
  const filtrado=L.filter(it=>{
    const lin=String(it.familia||'').toUpperCase();
    const mod=String(it.modelo||'').toUpperCase();
    const alinh=textoAlinhamentoItem(it);
    return lin.includes('VA')||mod.includes('VA')||alinh.includes('VA')||alinh.includes('VAP');
  });

  const detalhada=[];
  const abertos=[];
  const mapPortas=new Map();
  const mapFrames=new Map();

  const addPorta=(cod,modeloPorta,qtd)=>{
    const k=`${cod}|${modeloPorta}`;
    if(!mapPortas.has(k))mapPortas.set(k,{cod,modeloPorta,qtd:0});
    mapPortas.get(k).qtd+=qtd;
  };
  const addFrame=(cod,modeloFrame,qtd)=>{
    const k=`${cod}|${modeloFrame}`;
    if(!mapFrames.has(k))mapFrames.set(k,{cod,modeloFrame,qtd:0});
    mapFrames.get(k).qtd+=qtd;
  };

  for(const it of filtrado){
    const alinh=String(it.modelo||'N/A').trim();
    const modUpper=alinh.toUpperCase();
    const alinhUpper=textoAlinhamentoItem(it);
    const dimVal=compEmMetros(it)||1.25;
    const qtdExp=Number(it.qtd)||1;

    const isVap=/\bVAP\b/.test(modUpper);
    const isPvt=/\bPVT\b/.test(modUpper);
    const temPortaModelo=/\bVA[A-Z0-9]*P\b/.test(modUpper)&&!/\bVAP\b/.test(modUpper);
    const usaPorta=isVap||isPvt||temPortaModelo;

    if(!usaPorta){
      abertos.push({
        cliente:it.cliente,
        orfa:it.orfa,
        alinhamento:alinh,
        tipo:'EXPOSITOR ABERTO (S/ PORTA)',
        dimensao:dimVal,
        qtdExp,
        obs:'Requer programação manual de vidros'
      });
      continue;
    }

    let serigrafia='PRETA';
    if(alinhUpper.includes('CINZA'))serigrafia='CINZA';
    else if(alinhUpper.includes('PRETO')||alinhUpper.includes('PRETA'))serigrafia='PRETA';

    const dimMm=convDimPortasMm(dimVal);

    if(isVap){
      const numMap={1500:2,2250:3,3000:4,3750:5};
      const qtdPortasVap=(numMap[dimMm]??Math.round(dimMm/750))*qtdExp;
      const codPorta=CODIGOS_PORTAS_VAP[serigrafia]||'S/COD';
      const descPorta=`PORTA CONG DIR 730X1714 ${serigrafia}`;
      const codQuadro=CODIGOS_QUADROS_VAP[`${serigrafia}|${dimMm}`]||'S/COD';
      const descQuadro=`QUADRO ${dimMm}X1735 CONGELADOS ${serigrafia}`;
      const qtdQuadros=1*qtdExp;

      addPorta(codPorta,descPorta,qtdPortasVap);
      addFrame(codQuadro,descQuadro,qtdQuadros);

      detalhada.push({
        cliente:it.cliente,orfa:it.orfa,alinhamento:alinh,tipo:'VAP (Congelados)',
        dimensao:dimVal,qtdExp,
        codEsq:'-',qtdEsq:0,
        codDir:codPorta,qtdDir:qtdPortasVap,
        totalPortas:qtdPortasVap,
        codFrame:codQuadro,frameDesc:descQuadro,qtdFrames:qtdQuadros
      });
    } else {
      const tipoPortaDesc=isPvt?'TRANSPARENTE':'SERIGRAFADA';
      let qtdEsq=0,qtdDir=0;
      if(dimMm===1875){
        qtdEsq=1*qtdExp;
        qtdDir=2*qtdExp;
      } else {
        const pares=Math.round(dimMm/1250);
        qtdEsq=pares*qtdExp;
        qtdDir=pares*qtdExp;
      }
      const codEsq=CODIGOS_PORTAS_VA[`${serigrafia}|${tipoPortaDesc}|ESQ`]||'S/COD';
      const codDir=CODIGOS_PORTAS_VA[`${serigrafia}|${tipoPortaDesc}|DIR`]||'S/COD';
      const codFrame=CODIGOS_FRAMES_VA[`${serigrafia}|${dimMm}`]||'S/COD';
      const descFrameTxt=serigrafia==='CINZA'?`CJ FRAME RESFR. ${dimMm} CINZA`:`CJ FRAME RESFR ${dimMm} PRETO`;
      const qtdFrames=1*qtdExp;

      addPorta(codEsq,`PORTA ${serigrafia} ${tipoPortaDesc} ESQUERDA`,qtdEsq);
      addPorta(codDir,`PORTA ${serigrafia} ${tipoPortaDesc} DIREITA`,qtdDir);
      addFrame(codFrame,descFrameTxt,qtdFrames);

      detalhada.push({
        cliente:it.cliente,orfa:it.orfa,alinhamento:alinh,tipo:'VA (Standard c/ Porta)',
        dimensao:dimVal,qtdExp,
        codEsq,qtdEsq,
        codDir,qtdDir,
        totalPortas:qtdEsq+qtdDir,
        codFrame,frameDesc:descFrameTxt,qtdFrames
      });
    }
  }

  const portasResumo=[...mapPortas.values()].sort((a,b)=>a.cod.localeCompare(b.cod));
  const framesResumo=[...mapFrames.values()].sort((a,b)=>a.cod.localeCompare(b.cod));

  return {
    filtrado,
    detalhada,
    abertos,
    portasResumo,
    framesResumo,
    totalExpositores:detalhada.reduce((s,x)=>s+x.qtdExp,0),
    totalPortas:detalhada.reduce((s,x)=>s+x.totalPortas,0),
    totalFrames:detalhada.reduce((s,x)=>s+x.qtdFrames,0),
    totalAbertos:abertos.reduce((s,x)=>s+x.qtdExp,0)
  };
}

  3000:{vigaDesconto:10,qtdVigas:2,qtdPes:4,pesoUnitViga:6.0},
  3750:{vigaDesconto:10,qtdVigas:2,qtdPes:4,pesoUnitViga:8.0}
};
const CHAVES_CHASSIS=Object.keys(REGRAS_CHASSIS).map(Number);

function convDimChassisMm(valDim){
  const val=parseFloat(String(valDim??1.25).replace(',','.'));
  if(isNaN(val))return 1250;
  if(val>=1.74&&val<=1.78)return 1680;
  if(val>=1.85&&val<=1.89)return 1875;
  const mm=val<=10.0?Math.round(val*1000):Math.round(val);
  return CHAVES_CHASSIS.reduce((best,cur)=>Math.abs(cur-mm)<Math.abs(best-mm)?cur:best,CHAVES_CHASSIS[0]);
}

function calcTubosChassis(L){
  const itens=[];
  for(const it of L){
    const qtdChassis=Number(it.qtd)||1;
    const dimChassis=convDimChassisMm(it.comprimento);
    const cfg=REGRAS_CHASSIS[dimChassis];
    const compVigaMm=dimChassis-cfg.vigaDesconto;
    const qtdVigas=cfg.qtdVigas*qtdChassis;
    const qtdPes=cfg.qtdPes*qtdChassis;
    itens.push({
      cliente:it.cliente,
      orfa:it.orfa,
      chassiMm:dimChassis,
      qtdChassis,
      compVigaMm,
      pesoUnitViga:cfg.pesoUnitViga,
      qtdVigas,
      qtdPes
    });
  }

  const mapVigas=new Map();
  for(const r of itens){
    const k=`${r.chassiMm}|${r.compVigaMm}|${r.pesoUnitViga}`;
    if(!mapVigas.has(k))mapVigas.set(k,{chassiMm:r.chassiMm,compVigaMm:r.compVigaMm,pesoUnitViga:r.pesoUnitViga,totalVigas:0});
    mapVigas.get(k).totalVigas+=r.qtdVigas;
  }

  const vigasResumo=[...mapVigas.values()].map(v=>{
    const metragemTotal=Number(((v.compVigaMm*v.totalVigas)/1000).toFixed(2));
    const pesoTotal=Number((v.totalVigas*v.pesoUnitViga).toFixed(2));
    return {...v,metragemTotal,pesoTotal};
  });

  const totalChassis=itens.reduce((s,x)=>s+x.qtdChassis,0);
  const totalPesGeral=itens.reduce((s,x)=>s+x.qtdPes,0);
  const totalVigasGeral=vigasResumo.reduce((s,x)=>s+x.totalVigas,0);
  const barrasPes=Math.ceil(totalPesGeral/QTD_PES_POR_BARRA);
  const pesoTotalPes=Number((barrasPes*PESO_BARRA_PE_KG).toFixed(2));

  const pesResumo=[{
    descricao:'Barras para Pés de Chassi (5200mm - rende 4 pés)',
    compBarraMm:COMPRIMENTO_BARRA_PE,
    qtdBarras:barrasPes,
    pesoUnitBarra:PESO_BARRA_PE_KG,
    pesoTotal:pesoTotalPes
  }];

  const totalBarrasGeral=barrasPes+Math.ceil(totalVigasGeral/4);
  const pesoGeralTubos=vigasResumo.reduce((s,x)=>s+x.pesoTotal,0)+pesoTotalPes;

  return {
    itens,
    vigasResumo,
    pesResumo,
    totalChassis,
    totalPesGeral,
    totalBarrasGeral,
    pesoGeralTubos
  };
}

function setMpSel(cod,modo,val){
  const defModo='Pcs';
  const cur=MP.selecoes[cod]||{modo:defModo,val:0};
  const nextModo=modo!==undefined?String(modo):cur.modo;
  const nextVal=val!==undefined?(parseFloat(String(val).replace(',','.'))||0):cur.val;
  if(nextVal<=0&&nextModo===defModo){
    delete MP.selecoes[cod];
  } else {
    MP.selecoes[cod]={modo:nextModo,val:nextVal};
  }
  const elModo=$('mp_modo_'+cod);
  const elVal=$('mp_val_'+cod);
  if(elModo&&modo!==undefined)elModo.value=nextModo;
  if(elVal&&val!==undefined&&document.activeElement!==elVal)elVal.value=nextVal>0?nextVal:'';
  const resumoBox=$('mp_resumo_box');
  if(resumoBox)resumoBox.innerHTML=buildMpResumoHtml();
}

function buildMpResumoHtml(){
  const solItens=getSolicitacaoItens();
  const pesoGeral=solItens.reduce((s,x)=>s+x.pesoTotal,0);
  if(!solItens.length){
    return `<div class="box p-4 text-sm text-slate-500">Informe quantidades em pelo menos um material acima para habilitar o resumo e o PDF de compras.</div>`;
  }
  return `<div class="box p-4 space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h3 class="font-semibold">Resumo da Solicitação para Compras (${solItens.length} itens selecionados)</h3>
      <div class="text-sm font-bold">Peso Total Consolidado: ${fmtPt(pesoGeral)} kg</div>
    </div>
    ${table(['Código','Descrição do Material','Categoria','Quantidade Solicitada','Peso Total (Kg)'],solItens.map(i=>[`<b>${esc(i.cod)}</b>`,esc(i.nome),esc(i.tipo),esc(i.detalheQtd),i.pesoTotal>0?fmtPt(i.pesoTotal):'—']),[4])}
    <div class="noprint"><button class="btn" onclick="gerarPdfCompras()">Gerar PDF de Solicitação para Compras</button></div>
  </div>`;
}
function getSolicitacaoItens(){
  const out=[];
  for(const mat of BASE_MATERIAIS){
    const sel=MP.selecoes[mat.cod];
    if(!sel||sel.val<=0)continue;
    let detalheQtd='',pesoTotal=0;
    if(mat.isTubular){
      if(sel.modo==='Pcs'){
        const pcs=Math.round(sel.val);
        pesoTotal=0;
        detalheQtd=`${pcs} Pcs (${pcs*6} metros em barras de 6m)`;
      } else if(sel.modo==='Metros (m)'){
        const metros=Number(sel.val.toFixed(2));
        pesoTotal=0;
        detalheQtd=`${metros} m (~${Math.ceil(metros/6)} barras de 6m)`;
      } else {
        pesoTotal=Number(sel.val.toFixed(2));
        detalheQtd=`${pesoTotal} Kg (Informado Direto)`;
      }
    } else {
      if(sel.modo==='Pcs'){
        const pcs=Math.round(sel.val);
        pesoTotal=Number((pcs*mat.pesoUnit).toFixed(2));
        detalheQtd=`${pcs} Pcs`;
      } else {
        pesoTotal=Number(sel.val.toFixed(2));
        detalheQtd=`${pesoTotal} Kg`;
      }
    }
    out.push({cod:mat.cod,nome:mat.nome,tipo:mat.tipo,detalheQtd,pesoTotal});
  }
  return out;
}

function gerarPdfCompras(){
  const itens=getSolicitacaoItens();

  const [y,mo,d]=agoraBr.slice(0,10).split('-');
  const dataFormatada=`${d}/${mo}/${y} ${agoraBr.slice(11)}`;

  doc.setFillColor(10,37,64);
  doc.rect(15,15,180,12,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  doc.text('SOLICITAÇÃO DE COMPRAS DE MATERIAIS — REFRIGERAÇÃO',105,22.5,{align:'center'});

  doc.setFillColor(241,245,249);
  doc.rect(15,30,180,9,'F');

  doc.setFontSize(8.5);
  doc.text(`Data de Emissão: ${dataFormatada}   |   Solicitante: ${MP.solicitante}   |   Setor: ${MP.setor}`,18,35.8);

  doc.autoTable({
    startY:43,
    margin:{left:15,right:15},
    head:[['Cód.','Descrição do Material','Qtd Solicitada','Peso Total']],
    body:itens.map(i=>[i.cod,i.nome,i.detalheQtd,i.pesoTotal>0?`${i.pesoTotal} kg`:'—']),
    styles:{font:'helvetica',fontSize:8,cellPadding:2.5},
    headStyles:{fillColor:[0,82,204],textColor:[255,255,255],halign:'center'},
    columnStyles:{0:{halign:'center',cellWidth:20},2:{halign:'center',cellWidth:42},3:{halign:'center',cellWidth:28}},
    alternateRowStyles:{fillColor:[248,250,252]}
  });

  const yTotal=(doc.lastAutoTable?.finalY||100)+4;
  doc.setFillColor(226,232,240);
  doc.rect(15,yTotal,180,9,'F');
  doc.setTextColor(10,37,64);
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.text(`PESO TOTAL CONSOLIDADO (CHAPAS): ${fmtPt(pesoGeral)} KG`,192,yTotal+5.8,{align:'right'});

  const yAss=yTotal+28;
  doc.setTextColor(51,65,85);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.line(20,yAss,95,yAss);
  doc.line(115,yAss,190,yAss);

  doc.text(`Setor de Destino: ${MP.setor}`,152.5,yAss+5,{align:'center'});

  const stamp=new Date().toISOString().replace(/[-:T]/g,'').slice(0,12);
  doc.save(`Solicitacao_Compras_${MP.setor}_${stamp}.pdf`);
}

  if(!L.length)return empty();
  const g=group(L,i=>[i.familia,i.bojo,i.comprimento].join('|'),i=>({f:i.familia,b:i.bojo,c:i.comprimento,m:new Set()}));
  L.forEach(i=>g.find(x=>x.f===i.familia&&x.b===i.bojo&&x.c===i.comprimento).m.add(i.modelo));
  setTimeout(()=>chart('c1','bar',g.map(x=>`${x.b} • ${x.c} (${x.f})`),g.map(x=>x.qtd),'#d97706'));
  return `<div class="grid grid-cols-2 gap-4">${kpi('Total de bojos',sum(L))}${kpi('Combinações material × medida × família',g.length)}</div>${chartBox('c1','Bojos por material e dimensão')}
  ${table(['Família','Material','Dimensão','Modelos','Qtd'],g.map(x=>[badge(x.f),`<b>${esc(x.b)}</b>`,esc(x.c)+' mm',esc([...x.m].join(', ')),x.qtd]),[4])}`;
},
refrig(L){
  if(!L.length)return empty();
  const g=group(L,i=>[i.fluido,i.evaporador,i.modelo].join('|'),i=>({i}));
  setTimeout(()=>{const r=group(L,i=>gasEvap(i),i=>({n:gasEvap(i)}));chart('c1','bar',r.map(x=>x.n),r.map(x=>x.qtd),'#059669')});
  return `${chartBox('c1','Fluido / gás e evaporador')}${table(['Fluido / Gás','Evaporador','Modelo','ORFAs','Qtd'],g.map(x=>[esc(x.i.fluido||'-'),esc(x.i.evaporador||'-'),esc(x.i.modelo),esc([...x.orfas].join(', ')),x.qtd]),[4])}`;
},
separacao(L){
  const tg=`<div class="inline-flex rounded bg-slate-200 p-1 noprint"><button class="btn ${visao==='detalhada'?'':'sec'}" onclick="visao='detalhada';render()">Detalhada (ORFA / endereço)</button><button class="btn ${visao==='agrupada'?'':'sec'}" onclick="visao='agrupada';render()">Agrupada (soma de peças)</button></div>`;
  if(visao==='detalhada')return tg+table(['ORFA','Cliente','Entrega','Família','Modelo','Comp.','End.','Qtd','Acb. TT/PNL','Acb. Ext.','Caren.','Bojo / Grelha','Porta','Gás / Evap.','Obs.'],L.map(i=>[`<b>${esc(i.orfa)}</b>`,esc(i.cliente),esc(i.dataEntrega),badge(i.familia),`<b>${esc(i.modelo)}</b>`,esc(i.comprimento),esc(i.endereco),i.qtd,esc(i.acbTt),esc(i.acbExt),esc(i.carenFrontal),esc(i.bojo+' / '+i.grelha),esc(i.porta),esc(gasEvap(i)),esc(i.obsGeral)]),[7]);
  const g=groupSep(L);
  return tg+table(['Família','Modelo','Comp.','Qtd total','Acb. TT/PNL','Acb. Ext.','Caren.','Bojo / Grelha','Porta','Gás / Evap.','ORFAs'],g.map(x=>[badge(x.i.familia),`<b>${esc(x.i.modelo)}</b>`,esc(x.i.comprimento),x.qtd,esc(x.i.acbTt),esc(x.i.acbExt),esc(x.i.carenFrontal),esc(x.i.bojo+' / '+x.i.grelha),esc(x.i.porta),esc(gasEvap(x.i)),esc([...x.orfas].join(', '))]),[3]);
},
op_injecao(L){
  if(!L.length)return empty();
  const baseDet=calcInjecao(L);
  const det=tipoPecaFiltro==='ALL'?baseDet:baseDet.filter(x=>x.tipo===tipoPecaFiltro);
  const isSeq=visao==='sequencial';
  const isFamPeca=visao==='familia_peca';
  const agr=groupInjecao(L,isSeq,isFamPeca,tipoPecaFiltro);
  const tg=`<div class="flex flex-wrap items-center justify-between gap-2 noprint">
    <div class="inline-flex flex-wrap rounded bg-slate-200 p-1 gap-1">
      <button class="btn ${visao==='detalhada'?'':'sec'}" onclick="visao='detalhada';render()">Detalhada (por ORFA / item)</button>
      <button class="btn ${visao==='agrupada'?'':'sec'}" onclick="visao='agrupada';render()">Agrupada (soma de peças / inteiros)</button>
      <button class="btn ${visao==='sequencial'?'':'sec'}" onclick="visao='sequencial';render()">Sequencial OP (linha / peça / maior p/ menor)</button>
      <button class="btn ${visao==='familia_peca'?'':'sec'}" onclick="visao='familia_peca';render()">Por família de peças (Bojos, Costas, Tetos...)</button>
    </div>
    <select onchange="tipoPecaFiltro=this.value;render()">
      <option value="ALL" ${tipoPecaFiltro==='ALL'?'selected':''}>Todas as famílias de peças</option>
      <option value="BOJO" ${tipoPecaFiltro==='BOJO'?'selected':''}>Apenas Bojos</option>
      <option value="COSTAS" ${tipoPecaFiltro==='COSTAS'?'selected':''}>Apenas Costas</option>
      <option value="TETO" ${tipoPecaFiltro==='TETO'?'selected':''}>Apenas Tetos</option>
      <option value="TAMPO" ${tipoPecaFiltro==='TAMPO'?'selected':''}>Apenas Tampos</option>
      <option value="INTEIRO" ${tipoPecaFiltro==='INTEIRO'?'selected':''}>Apenas Inteiros</option>
    </select>
  </div>`;
  const kpis=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${kpi('Total de peças / itens',det.reduce((s,x)=>s+x.qtd,0))}${kpi('Itens agrupados',agr.length)}${kpi('Componentes (Bojo/Costas/Teto/Tampo)',det.filter(x=>x.modo==='COMPONENTE').reduce((s,x)=>s+x.qtd,0))}${kpi('Expositores inteiros',det.filter(x=>x.modo==='INTEIRO').reduce((s,x)=>s+x.qtd,0))}</div>`;

  const bojosMap=new Map();
  const linhaMap=new Map();
  for(const d of det){
    if(d.tipo==='BOJO'){
      const bk=`${d.peca} • ${d.material} (${d.dimensao})`;
      bojosMap.set(bk,(bojosMap.get(bk)||0)+d.qtd);
    }
    const lk=d.grupoLinha||d.familia;
    linhaMap.set(lk,(linhaMap.get(lk)||0)+d.qtd);
  }
  const bojosArr=[...bojosMap.entries()].sort((a,b)=>b[1]-a[1]);
  const linhaArr=[...linhaMap.entries()].sort((a,b)=>b[1]-a[1]);

  setTimeout(()=>{
    chart('c_op_bojos','bar',bojosArr.map(x=>x[0]),bojosArr.map(x=>x[1]),'#d97706');
    chart('c_op_linha','bar',linhaArr.map(x=>x[0]),linhaArr.map(x=>x[1]),'#0e7490');
  });

  const dash=`<div class="grid lg:grid-cols-2 gap-4">${chartBox('c_op_bojos','Quantidade total por bojo (conforme filtros)')}${chartBox('c_op_linha','Quantidade total por linha (conforme filtros)')}</div>`;

  if(visao==='detalhada'){
    return kpis+tg+table(['ORFA','Cliente','Família','Modelo','Tipo / Modo','Item / Peça','Material','Dimensão','Qtd'],det.map(x=>[`<b>${esc(x.orfa)}</b>`,esc(x.cliente),badge(x.familia),`<b>${esc(x.modelo)}</b>`,`<span class="tag">${esc(x.tipo)}</span>`,`<b>${esc(x.peca)}</b>`,esc(x.material),esc(x.dimensao),x.qtd]),[8])+dash;
  }
  if(visao==='sequencial'||visao==='familia_peca'){
    return kpis+tg+table(['Família de peça','Linha OP','Item / Peça','Material','Dimensão','Modelos','ORFAs','Qtd total'],agr.map(x=>[`<span class="tag">${esc(x.tipo)}</span>`,`<b>${esc(x.grupoLinha)}</b>`,`<b>${esc(x.peca)}</b>`,esc(x.material),esc(x.dimensao),esc([...x.modelos].join(', ')),esc([...x.orfas].join(', ')),x.qtd]),[7])+dash;
  }
  return kpis+tg+table(['Tipo / Modo','Item / Peça','Material','Dimensão','Modelos','ORFAs','Qtd total'],agr.map(x=>[`<span class="tag">${esc(x.tipo)}</span>`,`<b>${esc(x.peca)}</b>`,esc(x.material),esc(x.dimensao),esc([...x.modelos].join(', ')),esc([...x.orfas].join(', ')),x.qtd]),[6])+dash;
},

materiais_padrao(){
  const cats=['Todas',...new Set(BASE_MATERIAIS.map(m=>m.tipo))];
  const setores=['PCP','Engenharia','Produção','Montagem','Qualidade','Manutenção','Compras'];
  const filtrados=BASE_MATERIAIS.filter(m=>(MP.categoria==='Todas'||m.tipo===MP.categoria)&&(!MP.busca||m.cod.toLowerCase().includes(MP.busca)||m.nome.toLowerCase().includes(MP.busca)));
  const solItens=getSolicitacaoItens();
  const pesoGeral=solItens.reduce((s,x)=>s+x.pesoTotal,0);

  const cfgBox=`<div class="box p-4 grid md:grid-cols-2 gap-4 noprint">
    <div><label class="text-xs font-semibold block mb-1">Nome do Solicitante</label><input class="w-full" value="${esc(MP.solicitante)}" onchange="MP.solicitante=this.value"></div>
    <div><label class="text-xs font-semibold block mb-1">Setor de Destino</label><select class="w-full" onchange="MP.setor=this.value">${setores.map(s=>`<option ${MP.setor===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
  </div>`;

  const filtroBox=`<div class="box p-4 flex flex-wrap gap-3 noprint">
    <select onchange="MP.categoria=this.value;render()">${cats.map(c=>`<option ${MP.categoria===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
    <input class="flex-1 min-w-[200px]" placeholder="Pesquisar por Código ou Descrição (ex: 158212, Inox 304, Redondo...)" value="${esc(MP.busca)}" oninput="MP.busca=this.value.toLowerCase();clearTimeout(window._mp);window._mp=setTimeout(render,200)">
  </div>`;

  const nota=`<div class="text-xs text-slate-500">Para <b>Perfis Tubulares</b>: <b>Pcs</b> considera cada peça uma barra de 6m; <b>Metros (m)</b> calcula pelo comprimento informado; <b>Kg</b> insere o peso direto sem somar no peso automático de chapas.</div>`;

 const rowsHtml=filtrados.map(mat=>{
    const sel=MP.selecoes[mat.cod]||{modo:'Pcs',val:0};
    const modos=mat.isTubular?['Pcs','Metros (m)','Kg']:['Pcs','Kg'];
    const pesoExib=mat.isTubular?'Tubular (Sem Peso Fixo)':`${mat.pesoUnit} kg/un`;
    return `<tr>
      <td><b class="text-cyan-800">#${esc(mat.cod)}</b></td>
      <td>${esc(mat.nome)}</td>
      <td class="text-slate-500">${esc(pesoExib)}</td>
      <td><select id="mp_modo_${esc(mat.cod)}" onchange="setMpSel('${esc(mat.cod)}',this.value,undefined)">${modos.map(md=>`<option ${sel.modo===md?'selected':''} value="${md}">${md}</option>`).join('')}</select></td>
      <td><input id="mp_val_${esc(mat.cod)}" type="number" min="0" step="any" class="w-28" value="${sel.val>0?sel.val:''}" placeholder="0" oninput="setMpSel('${esc(mat.cod)}',undefined,this.value)"></td>
    </tr>`;
  }).join('');

const listaMat=`<div class="box scroll"><table><thead><tr><th>Código</th><th>Descrição</th><th>Ref. Peso</th><th>Modo</th><th>Qtd</th></tr></thead><tbody>${rowsHtml||`<tr><td colspan="5" class="text-center text-slate-500 py-6">Nenhum material encontrado.</td></tr>`}</tbody></table></div>`;

  let resumoHtml='';
  if(solItens.length){
    resumoHtml=`<div class="box p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h3 class="font-semibold">Resumo da Solicitação para Compras (${solItens.length} itens selecionados)</h3>
        <div class="text-sm font-bold">Peso Total Consolidado: ${fmtPt(pesoGeral)} kg</div>
      </div>
      ${table(['Código','Descrição do Material','Categoria','Quantidade Solicitada','Peso Total (Kg)'],solItens.map(i=>[`<b>${esc(i.cod)}</b>`,esc(i.nome),esc(i.tipo),esc(i.detalheQtd),i.pesoTotal>0?fmtPt(i.pesoTotal):'—']),[4])}
      <div class="noprint"><button class="btn" onclick="gerarPdfCompras()">Gerar PDF de Solicitação para Compras</button></div>
    </div>`;
  } else {
    resumoHtml=`<div class="box p-4 text-sm text-slate-500">Informe quantidades em pelo menos um material acima para habilitar o resumo e o PDF de compras.</div>`;
  }

 return cfgBox+filtroBox+nota+listaMat+`<div id="mp_resumo_box">${buildMpResumoHtml()}</div>`;
},
historico(){
  const up=can('import')?`<div id="drop" class="box border-2 border-dashed p-8 text-center cursor-pointer noprint" onclick="$('fi').click()">
    <input id="fi" type="file" accept="application/pdf" multiple class="hidden" onchange="importFiles([...this.files]);this.value=''">
    <p class="font-semibold">Arraste os PDFs das ORFAs ou clique para escolher</p>
    <p class="text-sm text-slate-500">A leitura é feita no navegador. Cada PDF fica salvo no histórico deste computador.</p></div>`:'';
  return up+table(['Data','Arquivo','ORFA','Cliente','Itens','Expositores','Importado por','Ações'],imports.map(i=>[new Date(i.date).toLocaleString('pt-BR'),esc(i.name),esc(i.orfa),esc(i.cliente),i.items.length,sum(i.items),esc(i.user),
    `<button class="btn sec" onclick="filterImport('${i.id}')">Ver</button> ${can('delete')?`<button class="btn bad" onclick="delImport('${i.id}')">Excluir</button>`:''}`]),[4,5]);
},
usuarios(){

  return `<div class="box p-4 flex flex-wrap gap-2 items-end noprint">
    <div><label class="text-xs block">Usuário</label><input id="nu"></div>

function groupSep(L){return group(L,i=>[i.familia,i.modelo,i.comprimento,i.acbTt,i.acbExt,i.carenFrontal,i.bojo,i.grelha,i.porta,gasEvap(i)].join('|'),i=>({i}))}

function render(){
  if(!ROLES[user.role].pages.includes(page))page=ROLES[user.role].pages[0];
  $('title').textContent=page==='familias'&&famSel?`Família: ${famSel}`:PAGES[page];

  $('view').innerHTML=(needData&&!items.length)?empty():V[page](L);

function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),6000)}

/* ================= AÇÕES ================= */
async function importFiles(files){
  const msgs=[];
  for(const f of files){
    toast(`Lendo ${f.name}...`);
    try{
      const buf=await f.arrayBuffer();
      const id=await sha(new TextDecoder('latin1').decode(buf.slice(0,200000))+buf.byteLength);
      if(imports.some(i=>i.id===id)){msgs.push(`${f.name}: já estava no histórico.`);continue}
      const its=await parsePdf(new Uint8Array(buf.slice(0)),f.name);
      await dbPut({id,name:f.name,date:Date.now(),user:user.name,orfa:its[0]?.orfa||'-',cliente:its[0]?.cliente||'-',items:its});
      msgs.push(`${f.name}: ${its.length} itens importados.`);
    }catch(e){console.error(e);msgs.push(`${f.name}: erro ao ler o PDF.`)}
  }
  await reload();render();toast(msgs.join(' '));
}
async function delImport(id){if(!can('delete')||!confirm('Excluir este PDF e seus itens do histórico?'))return;await dbDel(id);await reload();render()}
function filterImport(id){const i=imports.find(x=>x.id===id);F.orfa=i.orfa;F.cliente='ALL';go('separacao')}
function addUser(){
  const n=$('nu').value.trim(),p=$('np').value;if(!n||p.length<6)return toast('Informe usuário e senha com 6+ caracteres.');
  const us=getUsers();if(us.some(u=>u.name===n))return toast('Usuário já existe.');
  sha(p).then(h=>{us.push({name:n,pass:h,role:$('nr').value});setUsers(us);render()});
}
function delUser(n){if(confirm('Remover '+n+'?')){setUsers(getUsers().filter(u=>u.name!==n));render()}}
function exportExcel(){
  const L=filtered();if(!L.length)return;const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L.map(i=>({ORFA:i.orfa,Cliente:i.cliente,'Cidade/UF':i.cidadeUf,Entrega:i.dataEntrega,Família:i.familia,Modelo:i.modelo,Comprimento:i.comprimento,Endereço:i.endereco,Qtd:i.qtd,'Acb TT/PNL':i.acbTt,'Acb Externo':i.acbExt,'Caren Frontal':i.carenFrontal,Bojo:i.bojo,Grelha:i.grelha,Porta:i.porta,'Fluido/Gás':i.fluido||'-',Evaporador:i.evaporador||'-',Obs:i.obsGeral}))),'Detalhada');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(groupSep(L).map(g=>({Família:g.i.familia,Modelo:g.i.modelo,Comprimento:g.i.comprimento,'Qtd Total':g.qtd,'Acb TT/PNL':g.i.acbTt,'Acb Externo':g.i.acbExt,Caren:g.i.carenFrontal,Bojo:g.i.bojo,Grelha:g.i.grelha,Porta:g.i.porta,'Gás/Evap':gasEvap(g.i),ORFAs:[...g.orfas].join(', ')}))),'Agrupada');
  const bj=group(L,i=>[i.familia,i.bojo,i.comprimento].join('|'),i=>({f:i.familia,b:i.bojo,c:i.comprimento}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bj.map(b=>({Família:b.f,Material:b.b,'Dimensão (mm)':b.c,'Qtd Bojos':b.qtd}))),'Bojos');
  const opAgr=groupInjecao(L,visao==='sequencial',visao==='familia_peca',tipoPecaFiltro);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(opAgr.map(o=>({'Família de Peça':o.tipo,'Linha OP':o.grupoLinha,'Item / Peça':o.peca,Material:o.material,Dimensão:o.dimensao,Modelos:[...o.modelos].join(', '),ORFAs:[...o.orfas].join(', '),'Qtd Total':o.qtd}))),'OP INJEÇÃO');

  const bnd=calcBandejasPead(L);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bnd.pead.map(p=>({'Medida da Placa':p.medida,Espessura:p.espessura,'Tipo de Bandeja':p.tipoBandeja,'Qtd Placas':p.qtdPlacas,'Peso Unit. (kg)':p.pesoUnit,'Peso Total (kg)':p.pesoTotal}))),'PEAD');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bnd.porCliente.map(c=>({Cliente:c.cliente,'ORFA / OP':c.orfa,Modelo:c.modelo,'Módulos (1,25m)':c.modulos,'Bandeja C790':c.c790,'Bandeja C530':c.c530,'Bandeja C410':c.c410,'Total ABS':c.totalAbs}))),'Bandejas ABS');

  const chC=calcChapasCristal(L);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(chC.detalhamento.map(d=>({Cliente:d.cliente,'ORFA / OP':d.orfa,Linha:d.linha,'Dimensão (m)':d.dimensao,Alinhamento:d.alinhamento,'CH 2550 (UN)':d.ch2550,'CH 3780 (UN)':d.ch3780,'CH 4000 (UN)':d.ch4000,'Total Chapas':d.totalChapas,'Peso Total (kg)':d.pesoTotal}))),'Chapas Cristal');

  const chI=calcChapasInox(L);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(chI.resumo.map(r=>({Código:r.cod,'Descrição do Blank':r.desc,'Quantidade Total (un)':r.qtd,'Peso Total (kg)':r.peso}))),'Chapas Inox');

  const pf=calcPortasFrames(L);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pf.portasResumo.map(p=>({Código:p.cod,'Modelo de Porta':p.modeloPorta,'Qtd Portas (un)':p.qtd}))),'Portas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pf.framesResumo.map(f=>({Código:f.cod,'Modelo de Frame':f.modeloFrame,'Qtd Frames (un)':f.qtd}))),'Frames');

  const tb=calcTubosChassis(L);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tb.vigasResumo.map(v=>({'Chassi (mm)':v.chassiMm,'Compr. Viga (mm)':v.compVigaMm,'Peso Unit. Viga (kg)':v.pesoUnitViga,'Total de Vigas':v.totalVigas,'Metragem Total (m)':v.metragemTotal,'Peso Total (kg)':v.pesoTotal}))),'Tubos Vigas');

  XLSX.writeFile(wb,`ORFAs_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ================= LEITURA DO PDF (mesma lógica original) ================= */
function classificarFamilia(m){m=(m||'').toUpperCase().trim();
  if(/^VA/.test(m))return'VERTICAL ALTO';if(/^VRA/.test(m))return'AÇOUGUE';if(/^VCA/.test(m))return'AÇOUGUE';if(/^VR(?!A)/.test(m))return'PADARIA';
  if(/^(VIL|ICDT|ICFT|ICD|IC)/.test(m))return'ESPECIAIS';return'A DEFINIR'}
const normModelo=r=>(r||'').toUpperCase().replace(/\s+/g,' ').trim().replace(/\bVRAIP\b/g,'VRA1P').replace(/\bVROU\b/g,'VRQU');
const STOP=/\bAcb\.|\bBojo\s*:|\bGrelha\s*:|\bPerf\.|\bCaren\.|\bPorta\s*Etiqueta|\bSerigrafia\s*:|\bTesteira|\bPorta\s*:|\bFluido\s*\/?\s*G[aá]s\s*:|\bFluido\s*:|\bV[aá]lvula\s*:|\bMicromotor\s*:|\bCx\.\s*Comando\s*:|\bCx\.\s*El[eé]trica\s*:|\bVoltagem\s*:|\bEvaporador\s*:|\bIlumina[cç][aã]o\s*:|\bObs\.|\bInforma[cç][oõ]es\s*T[eé]cnica/i;
function after(block,label){const m=block.match(new RegExp(label.source+'\\s*[:\\-]?\\s*([^\\n|]+)','i'));return m?m[1].trim():''}
function clean(v){if(!v)return'';let c=v.trim();const i=c.search(STOP);if(i!==-1)c=c.slice(0,i).trim();c=c.replace(/^[:\-|\s]+|[:\-|\s]+$/g,'').trim();
  return /^(V[aá]lvula|Voltagem|Fluido\s*\/?\s*G[aá]s|Evaporador|Porta|Micromotor|Cx\.\s*Comando|Cx\.\s*El[eé]trica)\s*:?$/i.test(c)?'':c}
const BAD=/V[aá]lvula|Voltagem|Micromotor|Cx\.|Porta|Caren\.|Acb\.|Bojo|Grelha/i;
const material=(r,d)=>{const u=(r||'').toUpperCase();return/PR[EÉ]\s*PINTADO/.test(u)?'PRE PINTADO':/INOX/.test(u)?'INOX':(r||d)};
async function parsePdf(data,name){
  const pdf=await pdfjsLib.getDocument({data}).promise;
  let orfa=(name.match(/ORFA\s*([0-9]+(?:[.\-][0-9A-Z]+)?)/i)||[])[1]?.replace('-','/')||'NÃO IDENTIFICADA',cliente='CLIENTE NÃO IDENTIFICADO',cidade='',entrega='';
  const texts=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await(await pdf.getPage(p)).getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5]}));
    its.sort((a,b)=>Math.abs(b.y-a.y)>4?b.y-a.y:a.x-b.x);
    const lines=[];let cur=[],ly=null;
    for(const it of its){if(ly===null||Math.abs(it.y-ly)<=4)cur.push(it);else{cur.sort((a,b)=>a.x-b.x);lines.push(cur.map(x=>x.s).join(' '));cur=[it]}ly=it.y}
    if(cur.length){cur.sort((a,b)=>a.x-b.x);lines.push(cur.map(x=>x.s).join(' '))}
    const t=lines.join('\n');texts.push(t);
    let m=t.match(/N[°ºo]?\s*ORFA[:\s]*\n?\s*([0-9]{1,4}\s*\/\s*202[0-9](?:\s*-\s*\([^)]+\))?)/i);if(m)orfa=m[1].replace(/\s+/g,' ').trim();
    m=t.match(/DATA\s*ENTREGA[:\s]*\n?\s*(\d{2}\/\d{2}\/\d{4})/i);if(m)entrega=m[1];
    m=t.match(/CLIENTE[:\s]*\n?\s*([^\n]+)/i);if(m&&!/DATA\s*ENTREGA|CIDADE|N[°ºo]?\s*PEDIDO/i.test(m[1]))cliente=m[1].trim();
    m=t.match(/CIDADE[:\s]*\n?\s*([^\n]+)/i);if(m&&!/DATA\s*ENTREGA|BAIRRO|N[°ºo]?\s*PEDIDO/i.test(m[1]))cidade=m[1].trim();
  }
  const out=[],re=/\b(\d{2})\s+([A-Z]{2,}[A-Z0-9\s+\-]*?)\s+(\d{2,4})\s*\(([^()]+)\)/g;
  for(const t of texts){
    if(/Resumo\s+de\s+Balc[oõ]es\s+por\s+Endere[cç]o/i.test(t)&&!/Acb\.\s*TT\/PNL/i.test(t))continue;
    const ms=[...t.matchAll(re)];
    ms.forEach((m,k)=>{
      const modelo=normModelo(m[2]);
      const b=t.slice(k?ms[k-1].index+ms[k-1][0].length:0,k<ms.length-1?ms[k+1].index:t.length);
      const g=(l)=>clean(after(b,l));
      const porta=g(/\bPorta\b(?!\s*Etiqueta|\s*e\s*Configura)/i),fl=g(/Fluido\s*\/?\s*G[aá]s/i),ev=g(/\bEvaporador\b/i);
      out.push({arquivo:name,orfa,cliente,cidadeUf:cidade,dataEntrega:entrega||'-',familia:classificarFamilia(modelo),modelo,comprimento:m[3],
        endereco:m[4].replace(/\s+/g,' ').trim(),qtd:parseInt(m[1],10)||1,acbTt:g(/Acb\.\s*TT\/PNL/i)||'-',acbExt:g(/Acb\.\s*Externo/i)||'-',
        carenFrontal:g(/Caren\.\s*Frontal/i)||'-',bojo:material(g(/\bBojo\b/i),'NÃO INFORMADO'),grelha:material(g(/\bGrelha\b/i),'-'),
        porta:(!porta||/Fluido|G[aá]s|V[aá]lvula|Voltagem|Evaporador|Micromotor|Cx\.|Ilumina/i.test(porta))?'-':porta,
        fluido:BAD.test(fl)?'':fl,evaporador:BAD.test(ev)?'':ev,
        obsGeral:(after(b,/Obs\.\s*Geral/i).replace(/\bObs\.\s*(Laterais|Acabamento|Refrigera[cç][aã]o|Acess[oó]rios)\b.*$/i,'').replace(/^[:\-|\s]+|[:\-|\s]+$/g,'').trim())||'-'});
    });
  }
  return out;
}
